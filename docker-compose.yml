services:
  postgres:
    image: postgres:15
    container_name: docsign-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docsign
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Host port 5433 to avoid clashing with a native Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - docsign_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d docsign"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: docsign-redis
    restart: unless-stopped
    # Host port 6380 to avoid clashing with another Redis on 6379.
    ports:
      - "6380:6379"
    volumes:
      - docsign_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  docsign_pgdata:
  docsign_redisdata:
